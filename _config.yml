# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: D195 Data Analytics Capstone
author: Dr. Jim Ashe
logo: emp_rule_logo.png

only_build_toc_files: true

# Keep the build from scanning/executing the uv virtual environment and local-history snapshots
exclude_patterns:
  - .venv
  - "**/.venv/**"
  - .history
  - "**/.history/**"

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# In _config.yml
sphinx:
  extra_extensions:
    - sphinx_jupyterbook_latex
  config:
    bibtex_reference_style: author_year


# Information about where the book exists on the web
repository:
  url: https://github.com/ashejim/D195  # Online location of your book
  # path_to_book: docs  # DISABLED: this book lives at the repository ROOT, not in a docs/ subdir.
  # With it set, Jupyter Book builds the repository / "edit this page" links pointing to a
  # nonexistent docs/ path (e.g. .../D195/edit/main/docs/task1.md -> 404). Leave it off so those
  # links resolve to the actual files at the repo root.
  branch: main  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true

